name: Refresh activity observatory
on:
  schedule:
    - cron: '25 17 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: profile-stats
  cancel-in-progress: false
jobs:
  aggregate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify aggregation and cache
        run: node --test stats.test.cjs
      - name: Restore encrypted aggregate cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .stats-cache/aggregates.enc
          key: profile-aggregates-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: profile-aggregates-v2-
      - name: Generate aggregate profile
        env:
          STATS_TOKEN: ${{ secrets.PROFILE_STATS_READ_TOKEN }}
          STATS_CACHE_KEY: ${{ secrets.PROFILE_CACHE_KEY }}
        run: node generate-stats.cjs
      - name: Save encrypted aggregate cache
        if: ${{ always() && hashFiles('.stats-cache/aggregates.enc') != '' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .stats-cache/aggregates.enc
          key: profile-aggregates-v2-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Transfer aggregate README only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: profile-readme
          path: README.md
          retention-days: 1
          if-no-files-found: error
  publish:
    needs: aggregate
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: profile-readme
          path: .profile-output
      - name: Commit aggregate profile
        run: |
          cp .profile-output/README.md README.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh profile activity'
            git push
          fi
